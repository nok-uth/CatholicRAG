<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatholicRAG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07070f;
      --surface: #0e0e1a;
      --surface-2: #13131f;
      --border: #1e1e30;
      --gold: #c9a84c;
      --gold-dim: #7a6030;
      --ruby: #8b1a2a;
      --sapphire: #1a2a7a;
      --amethyst: #4a1a6e;
      --emerald: #0f4a2a;
      --text: #d4c9b0;
      --text-dim: #6e6658;
      --user-bg: #1a0a0a;
      --user-border: #5a1a28;
    }

    body {
      font-family: 'Palatino Linotype', Palatino, Georgia, serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Stained glass strip */
    .glass-strip {
      display: flex;
      height: 5px;
      flex-shrink: 0;
    }
    .glass-strip div {
      flex: 1;
    }
    .glass-strip div:nth-child(1)  { background: var(--ruby); }
    .glass-strip div:nth-child(2)  { background: var(--gold); }
    .glass-strip div:nth-child(3)  { background: var(--sapphire); }
    .glass-strip div:nth-child(4)  { background: var(--amethyst); }
    .glass-strip div:nth-child(5)  { background: var(--emerald); }
    .glass-strip div:nth-child(6)  { background: var(--gold); }
    .glass-strip div:nth-child(7)  { background: var(--ruby); }
    .glass-strip div:nth-child(8)  { background: var(--sapphire); }
    .glass-strip div:nth-child(9)  { background: var(--amethyst); }
    .glass-strip div:nth-child(10) { background: var(--emerald); }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .cross {
      color: var(--gold);
      font-size: 1.1rem;
      opacity: 0.85;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
    }

    header p {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      font-style: italic;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #chat-container::-webkit-scrollbar { width: 4px; }
    #chat-container::-webkit-scrollbar-track { background: transparent; }
    #chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message { max-width: 720px; width: 100%; }
    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }

    .bubble {
      padding: 0.875rem 1.1rem;
      border-radius: 4px;
      line-height: 1.75;
      font-size: 0.92rem;
    }

    .user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: #c8b8a0;
    }

    .assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* Gold left accent on assistant messages */
    .assistant .bubble {
      border-left: 2px solid var(--gold-dim);
    }

    .sources {
      margin-top: 0.6rem;
    }

    .sources summary {
      cursor: pointer;
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      user-select: none;
    }

    .sources summary::before {
      content: '▸';
      font-size: 0.6rem;
      transition: transform 0.2s;
    }

    details[open] > summary::before { transform: rotate(90deg); }

    .sources summary:hover { color: var(--gold-dim); }

    .source-list {
      margin-top: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .source-item {
      background: var(--surface-2);
      border-left: 2px solid var(--gold-dim);
      padding: 0.45rem 0.7rem;
      font-size: 0.76rem;
      color: #7a7060;
      line-height: 1.55;
    }

    .source-item strong {
      color: var(--gold-dim);
      display: block;
      margin-bottom: 0.1rem;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }

    #input-area {
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.65rem;
      flex-shrink: 0;
    }

    #question {
      flex: 1;
      padding: 0.7rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      max-height: 120px;
      line-height: 1.5;
    }

    #question::placeholder { color: var(--text-dim); }
    #question:focus { border-color: var(--gold-dim); }

    #send-btn {
      padding: 0.7rem 1.1rem;
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
      align-self: flex-end;
    }

    #send-btn:hover:not(:disabled) {
      background: var(--gold-dim);
      color: var(--bg);
    }

    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .thinking {
      display: flex;
      gap: 5px;
      padding: 0.875rem 1.1rem;
    }

    .thinking span {
      width: 6px; height: 6px;
      background: var(--gold-dim);
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }

    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.9); }
      40% { opacity: 1; transform: scale(1); }
    }

    #empty-state {
      margin: auto;
      text-align: center;
      max-width: 340px;
    }

    .empty-cross {
      font-size: 2.5rem;
      color: var(--gold-dim);
      display: block;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    #empty-state h2 {
      font-size: 1.1rem;
      font-weight: normal;
      color: var(--gold-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    #empty-state p {
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.7;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="glass-strip">
    <div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div>
  </div>

  <header>
    <span class="cross">✝</span>
    <h1>CatholicRAG</h1>
    <p>Catechism &amp; NABRE Bible</p>
  </header>

  <div id="chat-container">
    <div id="empty-state">
      <span class="empty-cross">✝</span>
      <h2>Ask about the Faith</h2>
      <p>Answers drawn from the Catechism of the Catholic Church and the New American Bible Revised Edition.</p>
    </div>
  </div>

  <div id="input-area">
    <textarea id="question" rows="1" placeholder="Ask a question about Catholic teaching or Scripture…"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const questionInput = document.getElementById('question');
    const sendBtn = document.getElementById('send-btn');

    let history = [];

    function appendMessage(role, content, sources) {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;
      wrapper.appendChild(bubble);

      if (sources && sources.length > 0) {
        const details = document.createElement('details');
        details.className = 'sources';

        const summary = document.createElement('summary');
        summary.textContent = `${sources.length} source${sources.length > 1 ? 's' : ''} retrieved`;
        details.appendChild(summary);

        const list = document.createElement('div');
        list.className = 'source-list';
        sources.forEach(s => {
          const item = document.createElement('div');
          item.className = 'source-item';
          item.innerHTML = `<strong>${s.label}</strong>${s.text}`;
          list.appendChild(item);
        });
        details.appendChild(list);
        wrapper.appendChild(details);
      }

      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendThinking() {
      const wrapper = document.createElement('div');
      wrapper.className = 'message assistant';
      wrapper.innerHTML = `<div class="thinking"><span></span><span></span><span></span></div>`;
      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return wrapper;
    }

    async function send() {
      const question = questionInput.value.trim();
      if (!question) return;

      questionInput.value = '';
      questionInput.style.height = 'auto';
      sendBtn.disabled = true;

      appendMessage('user', question);
      const thinking = appendThinking();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, history }),
        });
        const data = await res.json();
        thinking.remove();
        appendMessage('assistant', data.answer, data.sources);
        history.push({ role: 'user', content: question });
        history.push({ role: 'assistant', content: data.answer });
      } catch (err) {
        thinking.remove();
        appendMessage('assistant', 'Something went wrong. Please try again.');
      } finally {
        sendBtn.disabled = false;
        questionInput.focus();
      }
    }

    sendBtn.addEventListener('click', send);

    questionInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    questionInput.addEventListener('input', () => {
      questionInput.style.height = 'auto';
      questionInput.style.height = questionInput.scrollHeight + 'px';
    });
  </script>
</body>
</html>
